<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="저장한 로또 번호와 당첨 결과">
<title>보관함 · 로또랩</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='10' fill='%234f46e5'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%23fbbf24'/%3E%3Ccircle cx='22' cy='13' r='5' fill='%2360a5fa'/%3E%3Ccircle cx='17' cy='22' r='5' fill='%23f87171'/%3E%3C/svg%3E">
<script>
  // 화면이 그려지기 전에 테마를 정해 깜빡임을 막습니다.
  (function () {
    var t; try { t = localStorage.getItem('lottolab.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="vault">
<div class="app">
  <header class="appbar" id="top"></header>
  <main>
    <div class="page-head">
      <h1>보관함</h1>
      <p>저장한 번호와 당첨 결과예요. 저장한 뒤 처음 열린 추첨 결과로 확인하고, <b>매주 구매</b>를 켠 번호는 그 뒤의 모든 회차를 확인해요.</p>
    </div>

    <section class="card" id="vault-tools" hidden>
      <div class="card-head" style="margin-bottom:10px">
        <div><h2 class="card-title" id="vault-count">0게임</h2><p class="card-sub" id="vault-summary"></p></div>
      </div>
      <div id="vault-weekly" hidden style="margin-bottom:14px"></div>
      <div class="btn-row">
        <button class="btn btn-secondary btn-sm" type="button" id="vault-copy">전체 복사</button>
        <button class="btn btn-secondary btn-sm btn-danger" type="button" id="vault-clear">전체 삭제</button>
      </div>
    </section>

    <div id="vault-list"></div>

    <section class="card empty" id="vault-empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      <b>아직 저장한 번호가 없어요</b>
      <p>번호를 뽑아 저장하면 추첨 뒤 당첨 여부를 여기서 알려 드려요.</p>
      <a class="btn btn-primary" href="combiner.html">번호 뽑으러 가기</a>
    </section>

    <p class="hint">저장한 번호는 이 기기의 브라우저에만 보관돼요. 브라우저 데이터를 지우면 함께 사라져요.</p>

    <p class="notice"><b>참고</b> · 로또는 매 회차 독립적으로 추첨돼요. 과거 통계나 조합 조건으로 당첨 확률을 높일 수는 없고, 어떤 조합이든 1등 확률은 8,145,060분의 1로 같아요.</p>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
