<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="역대 로또 당첨번호 출현 횟수와 패턴 통계">
<title>통계 · 로또랩</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='10' fill='%234f46e5'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%23fbbf24'/%3E%3Ccircle cx='22' cy='13' r='5' fill='%2360a5fa'/%3E%3Ccircle cx='17' cy='22' r='5' fill='%23f87171'/%3E%3C/svg%3E">
<script>
  // 화면이 그려지기 전에 테마를 정해 깜빡임을 막습니다.
  (function () {
    var t; try { t = localStorage.getItem('lottolab.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stats">
<div class="app">
  <header class="appbar" id="top"></header>
  <main>
    <div class="page-head">
      <h1>통계</h1>
      <p>역대 당첨번호를 기간별로 살펴봐요. <span class="muted" id="stats-base"></span></p>
    </div>

    <div class="seg" id="period" role="group" aria-label="분석 기간" style="position:sticky;top:66px;z-index:20;box-shadow:var(--shadow)">
      <button type="button" data-p="0" aria-pressed="false">전체</button>
      <button type="button" data-p="100" aria-pressed="true">최근 100회</button>
      <button type="button" data-p="50" aria-pressed="false">50회</button>
      <button type="button" data-p="10" aria-pressed="false">10회</button>
    </div>

    <div id="stats-body" style="display:flex;flex-direction:column;gap:16px">
      <div class="skeleton" style="height:320px"></div>
      <div class="skeleton" style="height:240px"></div>
    </div>

    <p class="notice"><b>참고</b> · 로또는 매 회차 독립적으로 추첨돼요. 과거 통계나 조합 조건으로 당첨 확률을 높일 수는 없고, 어떤 조합이든 1등 확률은 8,145,060분의 1로 같아요.</p>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
