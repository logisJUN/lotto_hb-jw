<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="회차별 로또 당첨번호 조회와 내 번호 역대 당첨 확인">
<title>당첨 조회 · 로또랩</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='10' fill='%234f46e5'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%23fbbf24'/%3E%3Ccircle cx='22' cy='13' r='5' fill='%2360a5fa'/%3E%3Ccircle cx='17' cy='22' r='5' fill='%23f87171'/%3E%3C/svg%3E">
<script>
  // 화면이 그려지기 전에 테마를 정해 깜빡임을 막습니다.
  (function () {
    var t; try { t = localStorage.getItem('lottolab.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="simulator">
<div class="app">
  <header class="appbar" id="top"></header>
  <main>
    <div class="page-head">
      <h1>당첨 조회</h1>
      <p>회차별 당첨번호를 찾아보거나, 내 번호를 역대 전 회차에 맞춰 보세요.</p>
    </div>

    <div class="seg" id="check-tabs" role="tablist" aria-label="조회 방식">
      <button type="button" role="tab" data-tab="round" aria-selected="true" aria-controls="tab-round">회차별 당첨번호</button>
      <button type="button" role="tab" data-tab="mine" aria-selected="false" aria-controls="tab-mine">내 번호 맞춰보기</button>
    </div>

    <div id="tab-round" role="tabpanel" style="display:flex;flex-direction:column;gap:16px">
      <form class="card" id="round-form" style="padding:12px" aria-label="회차 이동">
        <div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center">
          <button class="icon-btn" type="button" id="prev-round" aria-label="이전 회차"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
          <label class="sr-only" for="round-input">회차 번호</label>
          <input class="input num" id="round-input" type="number" inputmode="numeric" min="1" placeholder="회차 입력" style="text-align:center;width:100%">
          <button class="btn btn-primary" type="submit" style="min-height:44px">이동</button>
          <button class="icon-btn" type="button" id="next-round" aria-label="다음 회차"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </form>
      <section class="card" id="round-card" aria-live="polite" style="scroll-margin-top:72px"><div class="skeleton" style="height:300px"></div></section>
      <section class="card" aria-labelledby="recent-title">
        <h2 class="card-title" id="recent-title" style="margin-bottom:6px">최근 10회</h2>
        <div class="draw-list" id="recent"></div>
      </section>
    </div>

    <div id="tab-mine" role="tabpanel" hidden style="display:flex;flex-direction:column;gap:16px">
      <section class="card" aria-labelledby="pick-title">
        <div class="card-head">
          <div><h2 class="card-title" id="pick-title">번호 6개 고르기</h2><p class="card-sub" id="pick-status" aria-live="polite">0 / 6개 선택</p></div>
          <button class="btn btn-ghost btn-sm" type="button" id="pick-clear">초기화</button>
        </div>
        <div class="board" id="pick-board"></div>
        <div class="btn-row" style="margin-top:16px">
          <button class="btn btn-secondary btn-sm" type="button" id="pick-random">무작위로 채우기</button>
          <select class="input btn-sm" id="pick-vault" aria-label="보관함에서 불러오기" style="min-height:36px;font-size:13px;flex:1;min-width:0"></select>
        </div>
        <button class="btn btn-primary btn-block" type="button" id="run-check" style="margin-top:12px" disabled>1~<span id="all-count">전체</span>회에 맞춰보기</button>
      </section>
      <section class="card" id="check-result" hidden aria-live="polite" style="scroll-margin-top:72px"></section>
    </div>

    <p class="notice"><b>참고</b> · 로또는 매 회차 독립적으로 추첨돼요. 과거 통계나 조합 조건으로 당첨 확률을 높일 수는 없고, 어떤 조합이든 1등 확률은 8,145,060분의 1로 같아요.</p>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
