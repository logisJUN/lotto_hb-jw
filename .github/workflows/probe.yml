name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do"
          curl -sS "$B?srchStrLtEpsd=1100&srchEndLtEpsd=1100" | jq -c .
          for r in "1&srchEndLtEpsd=1" "1&srchEndLtEpsd=300" "1&srchEndLtEpsd=2000" "1240&srchEndLtEpsd=1300" "1300&srchEndLtEpsd=1300" ; do
            echo "=== $r"
            curl -sS -w '\nstatus=%{http_code}\n' "$B?srchStrLtEpsd=$r" > /tmp/b; tail -1 /tmp/b
            head -n -1 /tmp/b | jq -c '{rc:.resultCode,msg:.resultMessage,n:(.data.list|length),first:.data.list[0].ltEpsd,last:.data.list[-1].ltEpsd,keys:(.data|keys)}' || head -c 300 /tmp/b
          done
          echo "=== no params"; curl -sS "$B" | head -c 400
