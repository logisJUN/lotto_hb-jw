name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://ipinfo.io/country || true
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          for u in \
            "https://www.dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=1100" \
            "https://dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=1100" \
            "https://www.dhlottery.co.kr/" \
            "https://www.dhlottery.co.kr/lt645/selectPstLt645Info.do?srchStrLtEpsd=1100&srchEndLtEpsd=1100" \
            "https://www.dhlottery.co.kr/gameResult.do?method=byWin&drwNo=1100" \
            "https://smok95.github.io/lotto/results/1100.json" \
            "https://smok95.github.io/lotto/results/latest.json" ; do
            echo "=== $u"
            curl -sSL -A "$UA" -o /tmp/b -w 'status=%{http_code} final=%{url_effective} type=%{content_type}\n' "$u" || true
            grep -o '<title>[^<]*' /tmp/b | head -1
            head -c 600 /tmp/b | tr '\n' ' '; echo
            grep -oiE '(점검|해외|차단|접근|block|denied)[^<]{0,80}' /tmp/b | head -5
          done
