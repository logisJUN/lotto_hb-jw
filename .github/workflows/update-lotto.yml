name: 로또 당첨번호 갱신

on:
  schedule:
    # 추첨은 토요일 20:35(KST). 토요일 21:07, 일요일 09:07(KST)에 한 번씩 받습니다.
    - cron: '7 12 * * 6'
    - cron: '7 0 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-lotto.mjs'
      - 'scripts/analyze.mjs'
      - 'js/rules.js'
      - '.github/workflows/update-lotto.yml'

permissions:
  contents: write

concurrency:
  group: update-lotto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 당첨번호 받기
        run: node scripts/fetch-lotto.mjs

      - name: 억지 분석 기록 갱신
        run: node scripts/analyze.mjs

      - name: 변경 사항 커밋
        run: |
          if [ -z "$(git status --porcelain -- data analysis)" ]; then
            echo "변경 없음"
            exit 0
          fi
          ROUND=$(node -p "require('./data/lotto.json').at(-1).round")
          if [ -n "$(git status --porcelain -- data)" ]; then MSG="로또 당첨번호 갱신 (${ROUND}회)"; else MSG="억지 분석 기록 갱신 (${ROUND}회)"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data analysis
          git commit -m "$MSG"
          git push
