<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<meta name="description" content="최신 로또 당첨번호, 다음 추첨까지 남은 시간, 빠른 번호 뽑기">
<title>홈 · 로또랩</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='10' fill='%234f46e5'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%23fbbf24'/%3E%3Ccircle cx='22' cy='13' r='5' fill='%2360a5fa'/%3E%3Ccircle cx='17' cy='22' r='5' fill='%23f87171'/%3E%3C/svg%3E">
<script>
  // 화면이 그려지기 전에 테마를 정해 깜빡임을 막습니다.
  (function () {
    var t; try { t = localStorage.getItem('lottolab.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
<div class="app">
  <header class="appbar" id="top"></header>
  <main>
    <section class="card hero" id="latest" aria-label="최신 당첨번호">
      <div class="skeleton" style="height:170px;opacity:.25"></div>
    </section>

    <section class="card" aria-labelledby="count-title">
      <div class="card-head"><div><h2 class="card-title" id="count-title">다음 추첨까지</h2><p class="card-sub" id="count-date">매주 토요일 오후 8:35</p></div></div>
      <div class="count" id="countdown" aria-live="off"></div>
    </section>

    <section class="card" aria-labelledby="quick-title">
      <div class="card-head">
        <div><h2 class="card-title" id="quick-title">빠른 번호 뽑기</h2><p class="card-sub">조건 없이 무작위로 5게임</p></div>
        <a class="link" href="combiner.html">조건 걸고 뽑기<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      </div>
      <div class="games" id="quick-games"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn-secondary" type="button" id="quick-reroll">다시 뽑기</button>
        <button class="btn btn-primary" type="button" id="quick-save">5게임 모두 저장</button>
      </div>
      <a class="link" href="combiner.html#saju" style="margin-top:10px">생년월일로 이번 주 사주 번호 받기<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
    </section>

    <section class="card" aria-labelledby="mine-title">
      <div class="card-head">
        <div><h2 class="card-title" id="mine-title">내 번호 결과</h2><p class="card-sub">보관함에 저장한 번호의 당첨 여부</p></div>
        <a class="link" href="vault.html">보관함<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a>
      </div>
      <div id="mine"><div class="skeleton" style="height:64px"></div></div>
    </section>

    <p class="notice"><b>참고</b> · 로또는 매 회차 독립적으로 추첨돼요. 과거 통계나 조합 조건으로 당첨 확률을 높일 수는 없고, 어떤 조합이든 1등 확률은 8,145,060분의 1로 같아요.</p>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
</div>
<script src="js/rules.js"></script>
<script src="js/saju.js"></script>
<script src="js/app.js"></script>
</body>
</html>
